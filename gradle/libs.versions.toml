[versions]
agp                  = "8.13.2"
kotlin               = "2.0.21"
ksp                  = "2.0.21-1.0.27"
composeBom           = "2024.09.03"
tvMaterial           = "1.0.0"
media3               = "1.4.1"
hilt                 = "2.52"
hiltNavCompose       = "1.2.0"
retrofit             = "2.11.0"
retrofitSerializer   = "1.0.0"
okhttp               = "4.12.0"
kotlinxSerialization = "1.7.3"
firebaseBom          = "33.4.0"
coil                 = "2.7.0"
datastore            = "1.1.1"
coroutines           = "1.9.0"
lifecycle            = "2.8.7"
activityCompose      = "1.9.3"
navigation           = "2.8.4"
zxing                = "3.5.3"

[libraries]
# Compose BOM
androidx-compose-bom          = { group = "androidx.compose",       name = "compose-bom",                  version.ref = "composeBom" }
androidx-ui                   = { group = "androidx.compose.ui",    name = "ui" }
androidx-ui-tooling           = { group = "androidx.compose.ui",    name = "ui-tooling" }
androidx-ui-tooling-preview   = { group = "androidx.compose.ui",    name = "ui-tooling-preview" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# TV Material (Compose for TV)
androidx-tv-material          = { group = "androidx.tv",            name = "tv-material",                  version.ref = "tvMaterial" }
androidx-tv-foundation        = { group = "androidx.tv",            name = "tv-foundation",                version.ref = "tvMaterial" }

# Media3 / ExoPlayer
androidx-media3-exoplayer     = { group = "androidx.media3",        name = "media3-exoplayer",             version.ref = "media3" }
androidx-media3-ui            = { group = "androidx.media3",        name = "media3-ui",                    version.ref = "media3" }

# Hilt
hilt-android                  = { group = "com.google.dagger",      name = "hilt-android",                 version.ref = "hilt" }
hilt-compiler                 = { group = "com.google.dagger",      name = "hilt-android-compiler",        version.ref = "hilt" }
hilt-navigation-compose       = { group = "androidx.hilt",          name = "hilt-navigation-compose",      version.ref = "hiltNavCompose" }

# Retrofit + OkHttp
retrofit                      = { group = "com.squareup.retrofit2", name = "retrofit",                     version.ref = "retrofit" }
retrofit-kotlinx-serialization= { group = "com.jakewharton.retrofit",name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerializer" }
okhttp-bom                    = { group = "com.squareup.okhttp3",   name = "okhttp-bom",                   version.ref = "okhttp" }
okhttp                        = { group = "com.squareup.okhttp3",   name = "okhttp" }
okhttp-logging                = { group = "com.squareup.okhttp3",   name = "logging-interceptor" }

# Kotlinx Serialization
kotlinx-serialization-json    = { group = "org.jetbrains.kotlinx",  name = "kotlinx-serialization-json",  version.ref = "kotlinxSerialization" }

# Firebase
firebase-bom                  = { group = "com.google.firebase",    name = "firebase-bom",                 version.ref = "firebaseBom" }
firebase-messaging            = { group = "com.google.firebase",    name = "firebase-messaging-ktx" }

# Coil
coil-compose                  = { group = "io.coil-kt",             name = "coil-compose",                 version.ref = "coil" }

# DataStore
datastore-preferences         = { group = "androidx.datastore",     name = "datastore-preferences",        version.ref = "datastore" }

# Coroutines
kotlinx-coroutines-android    = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android",  version.ref = "coroutines" }

# Lifecycle
lifecycle-runtime-ktx         = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx",        version.ref = "lifecycle" }
lifecycle-viewmodel-compose   = { group = "androidx.lifecycle",     name = "lifecycle-viewmodel-compose",  version.ref = "lifecycle" }
lifecycle-runtime-compose     = { group = "androidx.lifecycle",     name = "lifecycle-runtime-compose",    version.ref = "lifecycle" }

# Activity + Navigation
activity-compose              = { group = "androidx.activity",      name = "activity-compose",             version.ref = "activityCompose" }
navigation-compose            = { group = "androidx.navigation",    name = "navigation-compose",           version.ref = "navigation" }
zxing-core                    = { group = "com.google.zxing",       name = "core",                         version.ref = "zxing" }

[plugins]
android-application  = { id = "com.android.application",                    version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
# google-services    = { id = "com.google.gms.google-services",             version = "4.4.2" }
